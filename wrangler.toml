# Cloudflare Worker config (Workers Builds runs `npx wrangler deploy` on every push)
name = "reat"
main = "worker.js"
compatibility_date = "2026-09-01"
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first on every request so it can protect /app and /account.
run_worker_first = true

# Accounts, sessions and subscriptions. Wrangler creates this KV namespace on the first deploy.
[[kv_namespaces]]
binding = "USERS"

# Free Workers AI model for reading listings (no API key needed)
[ai]
binding = "AI"

[observability]
enabled = true
